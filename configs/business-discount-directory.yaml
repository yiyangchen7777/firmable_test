    'ADPAQ' and 'Allcracft Sewing Machines' (a typo of the trading name). Per the
    reviewer, the ontology allows multiple trading names, one observation each, and
    outlet-level names are this source's main value for downstream name matching,
    so it is mapped as a second entity.trading_name claim. Confidence is lower than
    for 'Trading Name' because some labels are location-suffixed or contain typos.
  conditional: false
