source_reliability:
  value: 0.9
  rationale: ACNC is the national charity regulator and this is its own Charity Register
    published under CC-BY, so identity, name and registration claims are authoritative.
reliability_overrides:
  entity.website: 0.6
  entity.trading_name: 0.7
record_id:
  strategy: composite
  columns:
  - ABN
  - Charity_Legal_Name
