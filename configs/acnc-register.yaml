fields:
- canonical: entity.abn
  source: ABN
  transforms:
  - trim
  - empty_to_null
  - strip_float_suffix
  - abn_normalize
  confidence: 0.95
  evidence: Column ABN holds 11-digit values such as 28679970527 and 80778454864.
    These are the charity's Australian Business Number, not an ACN, since all are
    11 digits. About 2% are blank (e.g. the row named 859701-Y9K2G5 PAF).
  conditional: false
- canonical: entity.legal_name
  source: Charity_Legal_Name
  transforms:
  - trim
  - empty_to_null
  confidence: 0.95
  evidence: Charity_Legal_Name holds values like Caloola Union Church and ZAMZAM FOUNDATION
    INCORPORATED. These are the registered names of the charity, distinct from Other_Organisation_Names,
    which holds alternative names.
  conditional: false
- canonical: entity.trading_name
  source: Other_Organisation_Names
  transforms:
  - trim
  - empty_to_null
  - split: ','
  confidence: 0.75
  evidence: Other_Organisation_Names holds comma-packed alternative names such as
    'ZamZam, ZamZam Foundation' and 'Allergy Life, Allergy Life Australia'. These
    are names other than the legal name, so they map to trading_name, one claim per
    part. Some values are truncated in the source. Occasional person names (e.g. 'Geofrey
    Osawa') are source dirt that the reviewer accepted.
  conditional: false
- canonical: address.full
  source: Address_Line_1
  transforms:
  - trim
  - empty_to_null
  confidence: 0.7
  evidence: Address_Line_1 holds street lines such as '2837 Trunkey Rd' and '18 California
    Road'. It is the primary street line of the Business address and is only partial,
    since Address_Line_2 and Address_Line_3 are sparse continuation lines. It is not
    a locality because Town_City holds that. PO Box values such as 'PO BOX 105' are
    source dirt that the reviewer accepted.
  conditional: false
- canonical: address.locality
  source: Town_City
  transforms:
  - trim
  - empty_to_null
  confidence: 0.92
  evidence: Town_City holds suburbs and towns such as Caloola, Oxley and Croydon South,
    which is the locality of the address.
  conditional: false
- canonical: address.state
  source: State
  transforms:
  - trim
  - empty_to_null
  - state_normalize
  confidence: 0.95
  evidence: State holds Australian state abbreviations (NSW, QLD, VIC, SA, WA, NT,
    TAS, ACT) for the registered business address. It is not the Operates_in_* flags,
    which describe where the charity operates.
  conditional: false
- canonical: address.postcode
  source: Postcode
  transforms:
  - trim
  - empty_to_null
  - strip_float_suffix
  - postcode_normalize
  confidence: 0.93
  evidence: Postcode holds 4-digit values such as 2795, 4075 and 3134, which are the
    Australian postcodes of the business address.
  conditional: false
- canonical: address.country
  source: Country
  transforms:
  - trim
  - empty_to_null
  - map_enum:
      mapping:
        Australia: AU
        AU: AU
  confidence: 0.92
  evidence: Country has the single value Australia for the business address. Per the
    reviewer it is normalised to the ISO code 'AU' with map_enum. This is not Operating_Countries,
    which lists ISO codes for where the charity operates.
  conditional: false
- canonical: entity.website
  source: Charity_Website
  transforms:
  - trim
  - empty_to_null
  - url_normalize
  confidence: 0.9
  evidence: Charity_Website holds URLs such as www.zamzam.org.au and https://www.warfrets.com.au.
    Some are Facebook pages, which are still the charity's declared web presence.
    Scheme-less values get http:// prepended.
  conditional: false
unmapped:
- source: Address_Type
  reason: Constant value Business; describes the address kind, no ontology field.
- source: Address_Line_2
  reason: Sparse continuation line (89% null) that sometimes holds a suburb; address.full
    uses Address_Line_1 only.
- source: Address_Line_3
  reason: Very sparse continuation line (98.5% null); no separate ontology field.
- source: Registration_Date
  reason: Date ACNC granted charity status, not the entity's own registration date.
    The separate Date_Organisation_Established column shows the source distinguishes
    the two, and pre-2012 organisations are all clamped to ACNC's Dec-2012 launch,
    a systematic bias that mapping cannot fix. Unmapped on reviewer instruction.
- source: Date_Organisation_Established
  reason: '''Established'' is not ''registered'', so it is not remapped to date_registered.
    It also holds 01/01/1900 placeholders. Unmapped on reviewer instruction; no ontology
    field.'
- source: Charity_Size
  reason: Size classification (Small/Medium/Large), no ontology field.
