fields:
- canonical: entity.trading_name
  source: BN_NAME
  transforms:
  - trim
  - empty_to_null
  confidence: 0.85
  evidence: BN_NAME holds values like ' SA Super Quiz', ' KB Freightlines' and ' Big
    C's Texas BBQ' (200 distinct of 200, 0% null). These are registered business names,
    which are trading names, not the holder's legal name, so this is not entity.legal_name.
    The register has no legal-name column; BN_ABN identifies the holder. Values carry
    leading whitespace, which trim removes.
  conditional: false
- canonical: entity.abn
  source: BN_ABN
  transforms:
  - trim
  - empty_to_null
  - strip_float_suffix
  - digits_only
  - abn_normalize
  confidence: 0.9
  evidence: BN_ABN holds values like '36437438294' and '94212794661', all 11-digit.
    It is the ABN of the business name holder. Blank on Deregistered rows (16% null),
    which become absence, not errors. BN_STATE_NUM is a different identifier (state
    business-name number such as 'BN98583878') and is not an ABN.
  conditional: false
unmapped:
- source: REGISTER_NAME
  reason: Constant 'BUSINESS NAMES' on every row (1 distinct); it names the register
    and carries no entity attribute.
- source: BN_REG_DT
  reason: Date the business name was registered (e.g. 22/10/2019). It is valid_from
    material for the name claim, which this engine does not yet carry. It is not the
    holder's registration date, so it would be wrong as entity.date_registered, and
    it is not observed_at.
- source: BN_CANCEL_DT
  reason: Cancellation date of the business name (86% null, only on Deregistered rows).
    It is valid_to material for the name claim, which this engine does not yet carry.
    It is not a per-record extract date, so not observed_at.
- source: BN_STATE_NUM
  reason: Legacy state-issued business name registration number (e.g. 'BN98583878',
    'B2163216W'), 96% null. It is not an ABN or ACN and has no ontology field.
- source: BN_STATE_OF_REG
  reason: State where the name was originally registered (NSW/VIC/QLD, 96% null),
    not the holder's address. Mapping it to address.state would be speculative.
- source: BN_STATUS
  reason: Status of the business-name registration ('Registered'/'Deregistered'),
    not of the holder entity. A cancelled name does not mean the holder is deregistered
    (e.g. a no-ABN row like 'Curry Festival' would wrongly emit entity.status=deregistered).
    Unmapped per human review and semantic flags.
