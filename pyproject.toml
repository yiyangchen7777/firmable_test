[project]
name = "firm"
version = "0.1.0"
description = "Firmable take-home: schema inference and entity identification at scale"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.40",
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
]

[project.scripts]
firm = "firm.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firm"]
